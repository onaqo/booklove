<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Book Loop Book</title>
    <link href="cdn/shop/t/146/assets/bootstrap.css" rel="stylesheet" type="text/css" media="all" />
    <link href="cdn/shop/t/146/assets/style.scss.css" rel="stylesheet" type="text/css" media="all" />
    <link href="cdn/shop/t/146/assets/fontawesome.css" rel="stylesheet" type="text/css" media="all" />
    <style>
        .cart-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .cart-header {
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        .cart-item img {
            width: 100px;
            height: 140px;
            object-fit: cover;
            margin-right: 20px;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .cart-item-price {
            font-size: 16px;
            color: #666;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 18px;
        }
        .qty-input {
            width: 60px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 5px;
        }
        .remove-btn {
            color: #dc3545;
            cursor: pointer;
            font-size: 20px;
            padding: 5px 10px;
        }
        .cart-summary {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            margin-top: 30px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .summary-total {
            font-size: 24px;
            font-weight: 700;
            border-top: 2px solid #333;
            padding-top: 15px;
            margin-top: 15px;
        }
        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .checkout-btn:hover {
            background: #218838;
        }
        .continue-shopping {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-cart h2 {
            margin-bottom: 20px;
        }
        .billing-form {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            margin-top: 30px;
            border: 1px solid #ddd;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .cart-item img {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <a href="/" class="continue-shopping">← Continue Shopping</a>
        </div>

        <div id="cart-content">
            <!-- Cart items will be loaded here -->
        </div>

        <div id="billing-section" style="display: none;">
            <div class="billing-form">
                <h2>Billing Details</h2>
                <form id="billing-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Street Address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">State/Province</label>
                            <input type="text" id="state" name="state">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="zip">ZIP/Postal Code *</label>
                            <input type="text" id="zip" name="zip" required>
                        </div>
                        <div class="form-group">
                            <label for="country">Country *</label>
                            <select id="country" name="country" required>
                                <option value="AE">United Arab Emirates</option>
                                <option value="US">United States</option>
                                <option value="GB">United Kingdom</option>
                                <option value="SA">Saudi Arabia</option>
                                <option value="IN">India</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="notes">Order Notes (Optional)</label>
                        <textarea id="notes" name="notes" rows="3"></textarea>
                    </div>
                    
                    <button type="submit" class="checkout-btn">Proceed to Payment</button>
                </form>
            </div>
        </div>
    </div>

    <script src="cdn/shop/t/146/assets/jquery.js"></script>
    <script src="cdn/shop/t/146/assets/cart-integration.js"></script>
    <script>
        // Wait for BookLoopCart to be available
        function initCartPage() {
            if (typeof window.BookLoopCart === 'undefined') {
                setTimeout(initCartPage, 50);
                return;
            }
            
            const Cart = window.BookLoopCart;
            
            console.log('=== CART PAGE DEBUG ===');
            console.log('BookLoopCart available:', typeof Cart !== 'undefined');
            console.log('Cart items:', Cart.get());

            // Render cart
            function renderCart() {
                const items = Cart.get();
                console.log('Rendering cart. Items found:', items.length);
                console.log('Items:', items);
                
                const container = $('#cart-content');
                console.log('Container found:', container.length);
                
                if (items.length === 0) {
                    console.log('Cart is empty, showing empty message');
                    container.html(`
                        <div class="empty-cart">
                            <h2>Your cart is empty</h2>
                            <p>Add some books to get started!</p>
                            <a href="/" class="checkout-btn" style="max-width: 300px; margin: 20px auto; display: block;">Continue Shopping</a>
                        </div>
                    `);
                    $('#billing-section').hide();
                    return;
                }
                
                let html = '<div class="cart-items">';
                
                items.forEach(item => {
                    const itemPrice = parseFloat(item.price) || 0;
                    const itemQty = parseInt(item.quantity) || 1;
                    const itemTotal = itemPrice * itemQty;
                    
                    html += `
                        <div class="cart-item" data-id="${item.id}">
                            <img src="${item.image}" alt="${item.title}" onerror="this.src='/cdn/shop/files/placeholder.jpg'">
                            <div class="cart-item-details">
                                <div class="cart-item-title">${item.title}</div>
                                <div class="cart-item-price">$${itemPrice.toFixed(2)}</div>
                            </div>
                            <div class="cart-item-qty">
                                <button class="qty-btn qty-minus" data-id="${item.id}">-</button>
                                <input type="number" class="qty-input" value="${itemQty}" min="1" data-id="${item.id}">
                                <button class="qty-btn qty-plus" data-id="${item.id}">+</button>
                            </div>
                            <div class="cart-item-total">
                                $${itemTotal.toFixed(2)}
                            </div>
                            <button class="remove-btn" data-id="${item.id}">×</button>
                        </div>
                    `;
                });
                
                html += '</div>';
                
                const total = Cart.getTotal();
                html += `
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span>$${total.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping:</span>
                            <span>Calculated at checkout</span>
                        </div>
                        <div class="summary-row summary-total">
                            <span>Total:</span>
                            <span>$${total.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                
                container.html(html);
                $('#billing-section').show();
            }

            // Event handlers
            $(document).on('click', '.qty-minus', function() {
                const id = String($(this).data('id'));
                const item = Cart.get().find(i => String(i.id) === id);
                if (item && item.quantity > 1) {
                    Cart.updateQuantity(id, item.quantity - 1);
                    renderCart();
                }
            });

            $(document).on('click', '.qty-plus', function() {
                const id = String($(this).data('id'));
                const item = Cart.get().find(i => String(i.id) === id);
                if (item) {
                    Cart.updateQuantity(id, item.quantity + 1);
                    renderCart();
                }
            });

            $(document).on('change', '.qty-input', function() {
                const id = String($(this).data('id'));
                const quantity = parseInt($(this).val()) || 1;
                Cart.updateQuantity(id, quantity);
                renderCart();
            });

            $(document).on('click', '.remove-btn', function() {
                const id = String($(this).data('id'));
                if (confirm('Remove this item from cart?')) {
                    Cart.remove(id);
                    renderCart();
                }
            });

            // Billing form submission
            $('#billing-form').on('submit', function(e) {
                e.preventDefault();
                
                const billingData = {
                    firstName: $('#firstName').val(),
                    lastName: $('#lastName').val(),
                    email: $('#email').val(),
                    phone: $('#phone').val(),
                    address: $('#address').val(),
                    city: $('#city').val(),
                    state: $('#state').val(),
                    zip: $('#zip').val(),
                    country: $('#country').val(),
                    notes: $('#notes').val()
                };
                
                // Save billing data
                localStorage.setItem('bookloop_billing', JSON.stringify(billingData));
                
                // Redirect to payment page
                window.location.href = '/checkout.html';
            });

            // Initialize
            $(document).ready(function() {
                console.log('Cart page loaded, jQuery version:', $.fn.jquery);
                console.log('Starting to render cart...');
                renderCart();
                Cart.updateCount();
                console.log('Cart initialized');
            });
        }
        
        // Start initialization
        initCartPage();
    </script>
</body>
</html>
